resources:
  swissgeo-features:
    type: collection
    title: SWISSGEO Features
    description: Swiss geodata features
    keywords: [switzerland, geodata, features, swisstopo]
    links:
      - type: text/html
        rel: canonical
        title: swisstopo
        href: https://www.swisstopo.admin.ch
        hreflang: en
    extents:
      spatial:
        bbox: [5.9, 45.8, 10.5, 47.9]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
      # Dummy extent covering the sample data. pygeoapi rejects any datetime=
      # outside this window with a 400, so keep it wide; `end: null` leaves it
      # open-ended, which suits forecast data.
      #
      # begin/end MUST stay unquoted: pygeoapi reads them as datetime objects
      # (api/__init__.py validate_datetime does te['begin'].tzinfo), and quoting
      # turns them into strings that raise "Configured times should be RFC3339".
      temporal:
        begin: 2026-01-01T00:00:00Z
        end: null
        trs: http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
    providers:
      - type: feature
        name: swissgeo_provider.SwissGeoProvider
        data:
          host: ${DB_HOST:-localhost}
          port: ${DB_PORT:-5432}
          dbname: ${DB_NAME:-service-oa-features}
          user: ${DB_USER:-service-oa-features}
          password: ${DB_PW:-swissgeo}
          search_path: [public]
        options:
          # RDS runs with rds.force_ssl=1, so its pg_hba only has hostssl
          # entries and any non-SSL connection is rejected with
          # "no pg_hba.conf entry for host ... no encryption".
          #
          # Note that with sslmode=prefer libpq silently retries without SSL
          # after a failed SSL attempt, so a wrong password surfaces as that
          # confusing pg_hba error rather than an auth error. Use require in
          # deployed environments to keep failures honest.
          sslmode: ${DB_SSLMODE:-prefer}
        resource_id: swissgeo-features
        table: sample_features
        id_field: external_id
        geom_field: geom
        time_field: forecast_datetime
        # point_name is a JSONB language struct, collapsed to a plain string by
        # SwissGeoProvider before the HTML templates read it.
        title_field: point_name
        languages:
          - en
          - de
          - fr
          - it
