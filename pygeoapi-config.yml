server:
  bind:
    host: 0.0.0.0
    port: 8080
  url: ${PYGEOAPI_HOSTNAME:-http://localhost:8080}${API_PREFIX:-/api/oaf/rc1}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en
  languages:
    - en
    - de
    - fr
    - it
  cors: true
  map:
    url: https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg
    attribution: '&copy; <a href="https://www.swisstopo.admin.ch">swisstopo</a>'
  pretty_print: true
  limits:
    default_items: 10
    max_items: 100

logging:
  level: DEBUG

